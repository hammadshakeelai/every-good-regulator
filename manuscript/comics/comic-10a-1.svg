<title id="t">Comic 10a.1 — Suggestion 48</title><desc id="d">Pat types while Unit 7 watches from behind with a clipboard. One keystroke brings 47 suggestions, then 48; Pat puts in earbuds. Final panel: Unit 7 silently holds up a sign reading YOU HAVE A REAL BUG ON LINE 12, and Pat does not look round.</desc>
