<title id="t">Comic 5.1 — Token Legend</title><desc id="d">Dee announces Pat as the month's Token Legend. Pat asks an AI what 2 + 2 is, then asks again, 'please explain in detail', and the reply scrolls off the panel. Final panel: an empty office printer feeding out an invoice that trails across the floor and out of the door.</desc>
