<title id="t">Comic 4.1 — Nobody is doing System 4</title><desc id="d">Pat has mapped the company onto Beer's Viable System Model. Dee asks what it says; nobody is doing System 4 — thinking about the future. Both turn to a wall calendar whose next-quarter page reads ROADMAP: TBD.</desc>
