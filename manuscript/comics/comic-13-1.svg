<title id="t">Comic 13.1 — Shipped is not adopted</title><desc id="d">Pat proudly presents THE PLATFORM: self-service, golden paths, one-click deploys. Dee asks how many teams use it; it's a communication problem. Three engineers each use a handmade contraption labelled my deploy thing. Final panel: the gleaming platform alone on its screen with a cobweb in the corner.</desc>
