<title id="t">Comic 3a.1 — The tower of to-do</title><desc id="d">A column of five floors read from the bottom up: a pint of milk; a sticky note saying milk; a phone app with the milk task tagged three ways; Pat with a clipboard for the weekly review of the app; Pat asleep among seven laptops. Beside it, the milk on floor 1 has gone off.</desc>
