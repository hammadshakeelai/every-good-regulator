<title id="t">Comic 10.1 — You just check it</title><desc id="d">Dee tells Pat that Unit 7 writes the code and Pat just checks it. At 9:07 Pat says it looks fine. At 4:52 Pat is asleep while Unit 7 announces 412 passed checks. Final panel: an empty chair, and one small red dot on the screen.</desc>
