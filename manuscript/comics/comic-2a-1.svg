<title id="t">Comic 2a.1 — Every part performed as specified</title><desc id="d">A little lander with a thermostat's face snaps its legs open high above Mars with a clunk, wonders whether that was the ground, decides it has landed, and switches off. Final panel: a quiet Martian landscape and a small puff of dust far away.</desc>
