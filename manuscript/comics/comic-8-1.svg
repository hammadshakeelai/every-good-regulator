<title id="t">Comic 8.1 — Just pick one</title><desc id="d">Dee asks for the root cause of the outage. Pat stands at a whiteboard covered in a tangle of eleven contributing conditions. Dee: just pick one. Final panel: the whiteboard wiped clean except for one small circle containing a stick figure labelled the intern.</desc>
