<text x="87.0" y="31.5" font-size="12.5" text-anchor="middle" font-family="'Segoe Print', 'Comic Sans MS', cursive" fill="#1a1a1a">So. What was the</text>
<text x="87.0" y="48.4" font-size="12.5" text-anchor="middle" font-family="'Segoe Print', 'Comic Sans MS', cursive" fill="#1a1a1a">root cause of the</text>
