<text x="141.0" y="27.5" font-size="10.5" text-anchor="middle" font-family="'Segoe Print', 'Comic Sans MS', cursive" fill="#1a1a1a">Well, there were eleven contributing</text>
<text x="141.0" y="41.7" font-size="10.5" text-anchor="middle" font-family="'Segoe Print', 'Comic Sans MS', cursive" fill="#1a1a1a">conditions. The permissions change, the</text>
<text x="141.0" y="55.9" font-size="10.5" text-anchor="middle" font-family="'Segoe Print', 'Comic Sans MS', cursive" fill="#1a1a1a">query, the size limit, the propagation—</text></g></g><rect width="390" height="290" fill="none" stroke="#1a1a1a" stroke-width="2.5"/></g>
