<text x="95.0" y="33.5" font-size="12.5" text-anchor="middle" font-family="'Segoe Print', 'Comic Sans MS', cursive" fill="#1a1a1a">The part's right</text>
<text x="95.0" y="50.4" font-size="12.5" text-anchor="middle" font-family="'Segoe Print', 'Comic Sans MS', cursive" fill="#1a1a1a">there. I installed</text>
