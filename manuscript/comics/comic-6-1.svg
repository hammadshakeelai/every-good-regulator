<title id="t">Comic 6.1 — The real records</title><desc id="d">In a hangar, a screen says aircraft 7 is not fit to fly because a part record is missing; Pat installed the part yesterday. Pat posts an Action Request into a box with a fee meter above it. Three months pass. Final panel: Pat keeps a huge spreadsheet labelled REAL RECORDS (DO NOT DELETE) while the official screen still says NOT FIT TO FLY.</desc>
