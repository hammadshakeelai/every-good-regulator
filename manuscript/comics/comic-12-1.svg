<title id="t">Comic 12.1 — The cord</title><desc id="d">Pat sees that a release is wrong and reaches for a red STOP RELEASE cord. Dee, across the room: who's pulling that? Pat freezes, sweating. Final panel, a week later: the cord is gone, replaced by a clipboard form titled Request to Consider Pausing a Release (please allow 5–7 working days).</desc>
