<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Georgia, serif" role="img" aria-labelledby="t d">
<title id="t">Figure 9.1 — Copy the model, or copy the principles</title>
<desc id="d">Two organisations. On the left, the original: a regulator whose model is fitted closely to a detailed work system of named people, particular tools, a history and a web of relationships. An arrow labelled copy carries the regulator across to a differently shaped organisation on the right, where the model still has the left organisation's shape and sits at an awkward angle with gaps showing. A thinner arrow labelled principles also crosses, and on the right a new model is being drawn around the second organisation to fit.</desc>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 H0 V20" fill="none" stroke="#efeee9" stroke-width="1"/></pattern>
</defs>
<rect width="860" height="480" fill="#fcfcfb"/><rect width="860" height="480" fill="url(#grid)"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#0b0b0b">Copy the model, or copy the principles</text>
<text x="24" y="58" font-size="13" fill="#52514e">A governing system is fitted to one organisation at one moment. Its shape travels badly; its reasons travel well.</text>

<!-- LEFT org -->
<text x="200" y="98" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b0b0b">the original</text>
<path d="M90,150 C 70,230 110,330 200,350 C 290,370 330,290 320,210 C 310,140 250,120 200,122 C 150,124 100,120 90,150 Z" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
<!-- model fitted -->
<path d="M104,156 C 86,230 122,320 200,336 C 280,352 312,286 305,212 C 298,152 248,136 200,138 C 152,140 112,134 104,156 Z" fill="none" stroke="#eb6834" stroke-width="2.5"/>
<text x="200" y="116" font-size="11" text-anchor="middle" fill="#eb6834" font-style="italic">model, fitted</text>
<!-- details -->
<g fill="none" stroke="#52514e" stroke-width="1"><line x1="150" y1="200" x2="230" y2="230"/><line x1="230" y1="230" x2="170" y2="290"/><line x1="150" y1="200" x2="170" y2="290"/><line x1="230" y1="230" x2="270" y2="280"/></g>
<g fill="#ffffff" stroke="#0b0b0b"><circle cx="150" cy="200" r="7"/><circle cx="230" cy="230" r="7"/><circle cx="170" cy="290" r="7"/><circle cx="270" cy="280" r="7"/></g>
<g font-size="10" fill="#0b0b0b"><text x="126" y="190">Aiko</text><text x="240" y="226">Bram</text><text x="140" y="308">Chen</text><text x="278" y="298">Dana</text></g>
<g font-size="10" fill="#52514e"><text x="120" y="250">their tools</text><text x="236" y="186">their history</text><text x="196" y="324">their trust</text></g>

<!-- arrows -->
<path d="M330,190 C 420,150 470,150 540,180" fill="none" stroke="#0b0b0b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="435" y="118" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b0b0b">copy</text>
<text x="435" y="134" font-size="11" text-anchor="middle" fill="#52514e">(the shape, the rituals, the names)</text>
<path d="M330,330 C 420,370 480,370 560,340" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aa)"/>
<text x="445" y="388" font-size="13" text-anchor="middle" font-style="italic" fill="#eb6834">principles</text>
<text x="445" y="404" font-size="11" text-anchor="middle" fill="#52514e">(why it worked there)</text>

<!-- RIGHT org: different shape -->
<text x="690" y="98" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b0b0b">the copy</text>
<path d="M560,160 L820,140 L800,250 L840,330 L600,360 L580,260 Z" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
<!-- copied model at an angle, wrong shape -->
<g transform="rotate(-14 690 250)">
  <path d="M594,166 C 576,240 612,330 690,346 C 770,362 802,296 795,222 C 788,162 738,146 690,148 C 642,150 602,144 594,166 Z" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-dasharray="9 4"/>
</g>
<text x="700" y="122" font-size="11" text-anchor="middle" fill="#0b0b0b" font-style="italic">copied model: the old shape, at an angle</text>
<g fill="#fdeee6" stroke="#eb6834"><circle cx="820" cy="300" r="10"/><circle cx="592" cy="200" r="10"/></g>
<text x="838" y="324" font-size="10" fill="#eb6834" text-anchor="end">gap</text><text x="576" y="204" font-size="10" fill="#eb6834" text-anchor="end">gap</text>
<!-- new model being drawn to fit -->
<path d="M572,268 L592,172 L808,154 L790,250" fill="none" stroke="#eb6834" stroke-width="2.5"/>
<g fill="none" stroke="#0b0b0b" stroke-width="1.3"><line x1="780" y1="262" x2="800" y2="244"/><polygon points="800,244 806,236 808,246" fill="#0b0b0b"/></g>
<text x="620" y="420" font-size="11" fill="#eb6834" font-style="italic">a new model, drawn around this organisation</text>

<text x="24" y="466" font-size="11" fill="#8a8984">After GM's attempts to copy NUMMI, and the many copies of the "Spotify model" (Chapter 9). The names on the left are placeholders.</text>
</svg>
