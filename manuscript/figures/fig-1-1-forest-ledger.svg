<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Georgia, serif" role="img" aria-labelledby="t d">
<title id="t">Figure 1.1 — The forest and the ledger</title>
<desc id="d">Left: a real forest in dense, varied detail — trees of different species and ages, underbrush, fungi, a bird, a fallen log, a person gathering firewood. Right: the same area as the state's ledger sees it — identical numbered trees in straight rows. An arrow labelled legibility runs left to right; a second arrow labelled management runs back, and under the left drawing the underbrush, fungi, bird and person are fading away.</desc>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 H0 V20" fill="none" stroke="#efeee9" stroke-width="1"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fcfcfb" stop-opacity="0"/><stop offset="1" stop-color="#fcfcfb" stop-opacity="0.85"/></linearGradient>
  <g id="spruce"><polygon points="0,-40 -14,0 14,0" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.3"/><line x1="0" y1="0" x2="0" y2="8" stroke="#0b0b0b" stroke-width="1.5"/></g>
</defs>
<rect width="860" height="480" fill="#fcfcfb"/><rect width="860" height="480" fill="url(#grid)"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#0b0b0b">The forest and the ledger</text>
<text x="24" y="58" font-size="13" fill="#52514e">To manage the forest, the state first had to see it. To see it, it had to leave most of it out.</text>

<!-- LEFT: real forest -->
<text x="200" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b0b0b">the forest</text>
<line x1="40" y1="360" x2="360" y2="360" stroke="#0b0b0b"/>
<g stroke="#0b0b0b" stroke-width="1.3" fill="#ffffff">
  <!-- broadleaf trees of different sizes -->
  <line x1="80" y1="360" x2="80" y2="270"/><ellipse cx="80" cy="245" rx="34" ry="36"/>
  <line x1="170" y1="360" x2="170" y2="300"/><ellipse cx="170" cy="285" rx="20" ry="22"/>
  <line x1="300" y1="360" x2="300" y2="240"/><ellipse cx="300" cy="205" rx="44" ry="48"/>
  <polygon points="230,230 212,300 248,300"/><line x1="230" y1="300" x2="230" y2="360"/>
  <polygon points="130,300 122,330 138,330"/><line x1="130" y1="330" x2="130" y2="360"/>
  <!-- fallen log -->
  <rect x="190" y="346" width="70" height="12" rx="6"/>
</g>
<!-- bird -->
<path d="M258,150 q8,-8 16,0 q8,-8 16,0" fill="none" stroke="#0b0b0b" stroke-width="1.5"/>
<!-- underbrush, fungi, person (fading) -->
<g>
  <g fill="none" stroke="#52514e" stroke-width="1.2"><path d="M50,360 q6,-18 12,0 q6,-14 12,0 q6,-18 12,0"/><path d="M100,360 q5,-14 10,0 q5,-16 10,0"/><path d="M320,360 q6,-16 12,0 q6,-12 12,0"/></g>
  <g fill="#eb6834"><path d="M268,360 v-8 a6,5 0 0 1 12,0 v8 z"/><path d="M283,360 v-5 a4,4 0 0 1 8,0 v5 z"/><path d="M60,360 v-5 a4,4 0 0 1 8,0 v5 z"/></g>
  <g fill="none" stroke="#0b0b0b" stroke-width="1.4"><circle cx="350" cy="316" r="6"/><line x1="350" y1="322" x2="350" y2="342"/><line x1="350" y1="342" x2="344" y2="358"/><line x1="350" y1="342" x2="356" y2="358"/><line x1="350" y1="328" x2="340" y2="334"/></g>
  <g stroke="#8a6a4a" stroke-width="2"><line x1="330" y1="336" x2="342" y2="332"/><line x1="331" y1="340" x2="342" y2="336"/></g>
  <rect x="40" y="300" width="330" height="70" fill="url(#fade)"/>
</g>
<g font-size="10" fill="#52514e"><text x="50" y="384">underbrush</text><text x="262" y="384">fungi</text><text x="326" y="384">firewood</text><text x="246" y="140">birds</text><text x="196" y="336">dead wood</text></g>
<text x="200" y="412" font-size="12" text-anchor="middle" fill="#52514e" font-style="italic">(fading — the parts the ledger never counted)</text>

<!-- arrows -->
<line x1="380" y1="210" x2="480" y2="210" stroke="#0b0b0b" stroke-width="2" marker-end="url(#ah)"/>
<text x="430" y="200" font-size="13" text-anchor="middle" font-style="italic" fill="#0b0b0b">legibility</text>
<line x1="480" y1="270" x2="380" y2="270" stroke="#eb6834" stroke-width="2" marker-end="url(#aa)"/>
<text x="430" y="292" font-size="13" text-anchor="middle" font-style="italic" fill="#eb6834">management</text>

<!-- RIGHT: ledger forest -->
<text x="660" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b0b0b">the ledger</text>
<rect x="500" y="110" width="320" height="270" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
<g stroke="#e4e3df"><line x1="500" y1="180" x2="820" y2="180"/><line x1="500" y1="250" x2="820" y2="250"/><line x1="500" y1="320" x2="820" y2="320"/></g>
<g>
  <use href="#spruce" x="540" y="170"/><use href="#spruce" x="600" y="170"/><use href="#spruce" x="660" y="170"/><use href="#spruce" x="720" y="170"/><use href="#spruce" x="780" y="170"/>
  <use href="#spruce" x="540" y="240"/><use href="#spruce" x="600" y="240"/><use href="#spruce" x="660" y="240"/><use href="#spruce" x="720" y="240"/><use href="#spruce" x="780" y="240"/>
  <use href="#spruce" x="540" y="310"/><use href="#spruce" x="600" y="310"/><use href="#spruce" x="660" y="310"/><use href="#spruce" x="720" y="310"/><use href="#spruce" x="780" y="310"/>
</g>
<g font-size="9" fill="#52514e" text-anchor="middle" font-family="Consolas, monospace">
  <text x="540" y="192">001</text><text x="600" y="192">002</text><text x="660" y="192">003</text><text x="720" y="192">004</text><text x="780" y="192">005</text>
  <text x="540" y="262">006</text><text x="600" y="262">007</text><text x="660" y="262">008</text><text x="720" y="262">009</text><text x="780" y="262">010</text>
  <text x="540" y="332">011</text><text x="600" y="332">012</text><text x="660" y="332">013</text><text x="720" y="332">014</text><text x="780" y="332">015</text>
</g>
<text x="660" y="366" font-size="12" text-anchor="middle" fill="#0b0b0b" font-family="Consolas, monospace">15 trees × timber value = revenue</text>
<text x="660" y="412" font-size="12" text-anchor="middle" fill="#52514e" font-style="italic">(one species, one age, straight rows)</text>

<text x="24" y="456" font-size="11" fill="#8a8984">After James C. Scott, Seeing Like a State (1998), on eighteenth-century German scientific forestry. The first rotation boomed;</text>
<text x="24" y="470" font-size="11" fill="#8a8984">by the second, Scott reports production losses of 20–30%.</text>
</svg>
