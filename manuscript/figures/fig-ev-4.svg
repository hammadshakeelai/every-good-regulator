<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Georgia, serif" role="img" aria-labelledby="t"><title id="t">Exploded View 4 — One person&#x27;s operating system</title><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 H0 V20" fill="none" stroke="#e9eef5" stroke-width="1"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect width="1200" height="820" fill="#fcfcfb"/><rect width="1200" height="820" fill="url(#g)"/><rect x="10" y="10" width="1180" height="800" fill="none" stroke="#0b0b0b" stroke-width="1.5"/><text x="30" y="50" font-size="13" text-anchor="start" fill="#eb6834" font-weight="bold">EXPLODED VIEW 4</text><text x="30" y="80" font-size="26" text-anchor="start" fill="#0b0b0b" font-weight="bold">One person&#x27;s operating system</text><text x="30" y="104" font-size="14" text-anchor="start" fill="#52514e" font-style="italic">Part Four in one drawing: a governing layer small enough to keep alive.</text><circle cx="470" cy="470" r="300" fill="#f3f2ee" stroke="#c9c8c3" stroke-width="2" stroke-dasharray="2 5"/><circle cx="470" cy="470" r="190" fill="none" stroke="#52514e" stroke-width="1.5"/><circle cx="470" cy="470" r="95" fill="#fdeee6" stroke="#eb6834" stroke-width="3"/><circle cx="470" cy="448" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><path d="M461,442 l-3,-6 l6,3 l2,-7 l4,6 l3,-7 l2,7 l5,-4 l-1,7" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/><circle cx="466" cy="447" r="1.4" fill="#1a1a1a"/><circle cx="474" cy="447" r="1.4" fill="#1a1a1a"/><path d="M466,452 q4,4 8,0" stroke="#1a1a1a" fill="none" stroke-width="1.3" stroke-linecap="round"/><line x1="470" y1="459" x2="470" y2="486" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="470" y1="468" x2="460" y2="490" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="470" y1="468" x2="480" y2="490" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><path d="M462,510 L470,486 L478,510" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="412" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="bold">you</text><rect x="500" y="440" width="54" height="66" fill="#ffffff" stroke="#0b0b0b"/><line x1="506" y1="450" x2="548" y2="450" stroke="#52514e"/><line x1="506" y1="461" x2="543" y2="461" stroke="#52514e"/><line x1="506" y1="472" x2="538" y2="472" stroke="#52514e"/><line x1="506" y1="483" x2="533" y2="483" stroke="#52514e"/><line x1="506" y1="494" x2="528" y2="494" stroke="#52514e"/><circle cx="554" cy="450" r="3" fill="#eb6834"/><path d="M554,450 L800,330" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="806" y="334" font-size="12.5" text-anchor="start" fill="#eb6834" font-weight="bold">Today&#x27;s list (ch. 15)</text><text x="806" y="349" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">one plain text file; refreshed nightly</text><rect x="430" y="265" width="80" height="44" fill="#ffffff" stroke="#0b0b0b"/><rect x="430" y="265" width="80" height="12" fill="#eb6834"/><circle cx="510" cy="280" r="3" fill="#52514e"/><path d="M510,280 L800,230" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="806" y="234" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="bold">The calendar</text><text x="806" y="249" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">only things with dates</text><path d="M270,480 h60 l10,24 h-80 z" fill="#ffffff" stroke="#0b0b0b"/><rect x="280" y="464" width="40" height="16" fill="#ffffff" stroke="#0b0b0b"/><circle cx="270" cy="490" r="3" fill="#52514e"/><path d="M270,490 L150,560" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="144" y="564" font-size="12.5" text-anchor="end" fill="#0b0b0b" font-weight="bold">The inbox</text><text x="144" y="579" font-size="11" text-anchor="end" fill="#52514e" font-style="italic">a queue, not a to-do list</text><g transform="translate(650,650)" fill="#ecebe6" stroke="#a9a8a2"><rect width="70" height="86"/><rect x="8" y="8" width="54" height="20"/><rect x="8" y="33" width="54" height="20"/><rect x="8" y="58" width="54" height="20"/></g><circle cx="720" cy="690" r="3" fill="#52514e"/><path d="M720,690 L800,710" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="806" y="714" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="bold">The archive</text><text x="806" y="729" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">asks nothing of you (ch. 15)</text><g transform="translate(270,720) scale(0.8) translate(-270,-720)"><rect x="254" y="710" width="32" height="10" rx="5" fill="#e4e3df" stroke="#1a1a1a" stroke-width="1.8"/><rect x="255" y="676" width="30" height="34" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><rect x="263" y="684" width="14" height="9" fill="#eb6834" opacity="0.8"/><text x="270" y="705" font-size="9" text-anchor="middle" font-family="Georgia, serif" fill="#1a1a1a">7</text><rect x="256" y="650" width="28" height="24" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><line x1="270" y1="650" x2="270" y2="640" stroke="#1a1a1a" stroke-width="1.8"/><circle cx="270" cy="638" r="3" fill="#eb6834"/><rect x="262" y="658" width="4" height="4" fill="#1a1a1a"/><rect x="274" y="658" width="4" height="4" fill="#1a1a1a"/><path d="M264,666 q6,5 12,0" stroke="#1a1a1a" fill="none" stroke-width="1.6"/><line x1="255" y1="684" x2="249" y2="706" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="285" y1="684" x2="291" y2="706" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/></g><circle cx="256" cy="670" r="3" fill="#52514e"/><path d="M256,670 L205,760" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="199" y="764" font-size="12.5" text-anchor="end" fill="#0b0b0b" font-weight="bold">The assistant (ch. 10)</text><text x="199" y="779" font-size="11" text-anchor="end" fill="#52514e" font-style="italic">it does the filing;</text><text x="199" y="794" font-size="11" text-anchor="end" fill="#52514e" font-style="italic">you keep the thinking</text><rect x="890" y="480" width="140" height="90" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><circle cx="920" cy="510" r="16" fill="none" stroke="#52514e" stroke-width="3" stroke-dasharray="4 3"/><circle cx="960" cy="530" r="22" fill="none" stroke="#52514e" stroke-width="3" stroke-dasharray="4 3"/><circle cx="1000" cy="508" r="14" fill="none" stroke="#52514e" stroke-width="3" stroke-dasharray="4 3"/><text x="960" y="470" font-size="11" text-anchor="middle" fill="#0b0b0b" font-weight="bold">THE SUNDAY MACHINE</text><text x="960" y="588" font-size="10" text-anchor="middle" fill="#52514e" font-style="italic">tags · templates · backlinks · plugins</text><path d="M890,520 C 820,500 760,480 590,470" stroke="#52514e" fill="none" stroke-dasharray="3 4" marker-end="url(#ah)"/><g transform="translate(960,650)"><polygon points="-18,-44 18,-44 44,-18 44,18 18,44 -18,44 -44,18 -44,-18" fill="#eb6834"/><text x="0" y="6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">STOP</text></g><circle cx="990" cy="684" r="3" fill="#eb6834"/><path d="M990,684 L1170,770" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="1164" y="774" font-size="12.5" text-anchor="end" fill="#eb6834" font-weight="bold">The system for maintaining the system</text><text x="1164" y="789" font-size="11" text-anchor="end" fill="#52514e" font-style="italic">the level that controls only itself (3a)</text><g transform="translate(110,300)"><path d="M-20,0 L-24,-28 H24 L20,0 Z" fill="#e4e3df" stroke="#0b0b0b"/><line x1="0" y1="-28" x2="0" y2="-56" stroke="#3f7a3f" stroke-width="2"/><path d="M0,-46 C -14,-54 -20,-64 -16,-70 C -8,-66 -2,-58 0,-46 Z" fill="#8fbf7f" stroke="#3f7a3f"/><path d="M0,-52 C 12,-60 20,-68 16,-74 C 8,-70 2,-62 0,-52 Z" fill="#8fbf7f" stroke="#3f7a3f"/></g><circle cx="126" cy="250" r="3" fill="#52514e"/><path d="M126,250 L150,190" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="156" y="194" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="bold">Gall&#x27;s law, at home (ch. 13)</text><text x="156" y="209" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">start with one file that works</text><g transform="translate(580,190)"><path d="M0,40 h80 v-26 l-40,-18 l-40,18 z" fill="#ffffff" stroke="#52514e"/><line x1="16" y1="14" x2="16" y2="40" stroke="#52514e"/><line x1="40" y1="14" x2="40" y2="40" stroke="#52514e"/><line x1="64" y1="14" x2="64" y2="40" stroke="#52514e"/></g><circle cx="660" cy="220" r="3" fill="#52514e"/><path d="M660,220 L800,150" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="806" y="154" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="bold">A mausoleum of old interests</text><text x="806" y="169" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">notes about a person you no longer are</text></svg>