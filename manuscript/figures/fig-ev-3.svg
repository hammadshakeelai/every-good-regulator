"#1a1a1a" stroke-width="2" stroke-linecap="round"/></g><circle cx="690" cy="336" r="3" fill="#52514e"/><path d="M690,336 L706,128" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="712" y="132" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="bold">Agents that write, test and ship (ch. 3)</text><text x="712" y="147" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">tireless; confident; never say &quot;I don&#x27;t know&quot;</text><rect x="330" y="398" width="24" height="20" fill="#eef5ff" stroke="#0b0b0b"/><text x="342" y="412" font-size="9" text-anchor="middle" fill="#0b0b0b">{ }</text><rect x="470" y="398" width="24" height="20" fill="#eef5ff" stroke="#0b0b0b"/><text x="482" y="412" font-size="9" text-anchor="middle" fill="#0b0b0b">{ }</text><rect x="610" y="398" width="24" height="20" fill="#eef5ff" stroke="#0b0b0b"/><text x="622" y="412" font-size="9" text-anchor="middle" fill="#0b0b0b">{ }</text><rect x="760" y="398" width="24" height="20" fill="#eef5ff" stroke="#0b0b0b"/><text x="772" y="412" font-size="9" text-anchor="middle" fill="#0b0b0b">{ }</text><rect x="840" y="398" width="24" height="20" fill="#eef5ff" stroke="#0b0b0b"/><text x="852" y="412" font-size="9" text-anchor="middle" fill="#0b0b0b">{ }</text><rect x="980" y="170" width="160" height="150" rx="6" fill="#e4e3df" stroke="#0b0b0b" stroke-width="2"/><circle cx="1060" cy="245" r="30" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><line x1="1060" y1="215" x2="1060" y2="275" stroke="#0b0b0b"/><line x1="1030" y1="245" x2="1090" y2="245" stroke="#0b0b0b"/><text x="1060" y="160" font-size="11" text-anchor="middle" fill="#0b0b0b" font-weight="bold">HOLDOUT SCENARIOS</text><circle cx="1000" cy="320" r="3" fill="#52514e"/><path d="M1000,320 L1150,370" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="1144" y="374" font-size="12.5" text-anchor="end" fill="#0b0b0b" font-weight="bold">Locked where the agents can&#x27;t see (ch. 11)</text><text x="1144" y="389" font-size="11" text-anchor="end" fill="#52514e" font-style="italic">checkable; blind to the unwritten</text><path d="M920,430 C 980,430 1040,380 1060,322" stroke="#52514e" fill="none" stroke-dasharray="4 4" marker-end="url(#ah)"/><line x1="820" y1="640" x2="1000" y2="640" stroke="#0b0b0b" stroke-width="3"/><line x1="830" y1="640" x2="830" y2="740" stroke="#0b0b0b"/><line x1="990" y1="640" x2="990" y2="740" stroke="#0b0b0b"/><rect x="880" y="590" width="80" height="48" fill="#ffffff" stroke="#0b0b0b"/><text x="920" y="612" font-size="10" text-anchor="middle" fill="#6aa86a" font-weight="bold">412 passed</text><circle cx="948" cy="628" r="3" fill="#d9362b"/><g transform="translate(790,740) scale(0.9) translate(-790,-740)"><circle cx="790" cy="670" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><path d="M781,664 l-3,-6 l6,3 l2,-7 l4,6 l3,-7 l2,7 l5,-4 l-1,7" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/><path d="M784,669 q2,2 4,0 M792,669 q2,2 4,0" stroke="#1a1a1a" fill="none" stroke-width="1.2"/><path d="M788,675 h4" stroke="#1a1a1a" fill="none" stroke-width="1.3" stroke-linecap="round"/><line x1="790" y1="681" x2="790" y2="710" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="790" y1="690" x2="810" y2="720" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="790" y1="690" x2="814" y2="716" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><path d="M790,710 L810,710 L810,740" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M790,710 L807,713 L805,740" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/></g><text x="816" y="600" font-size="14" text-anchor="start" fill="#52514e">z</text><text x="826" y="588" font-size="17" text-anchor="start" fill="#52514e">z</text><circle cx="948" cy="628" r="3" fill="#eb6834"/><path d="M948,628 L11