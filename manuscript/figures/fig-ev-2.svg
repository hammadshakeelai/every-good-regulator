<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Georgia, serif" role="img" aria-labelledby="t"><title id="t">Exploded View 2 — A loop that acts but cannot hear</title><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 H0 V20" fill="none" stroke="#e9eef5" stroke-width="1"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect width="1200" height="820" fill="#fcfcfb"/><rect width="1200" height="820" fill="url(#g)"/><rect x="10" y="10" width="1180" height="800" fill="none" stroke="#0b0b0b" stroke-width="1.5"/><text x="30" y="50" font-size="13" text-anchor="start" fill="#eb6834" font-weight="bold">EXPLODED VIEW 2</text><text x="30" y="80" font-size="26" text-anchor="start" fill="#0b0b0b" font-weight="bold">A loop that acts but cannot hear</text><text x="30" y="104" font-size="14" text-anchor="start" fill="#52514e" font-style="italic">Part Two in one drawing: the F-35 logistics loop, and where each failure of Part Two lives in it.</text><line x1="30" y1="740" x2="1170" y2="740" stroke="#0b0b0b" stroke-width="2"/><path d="M60,740 V430 Q 300,300 540,430 V740" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><text x="300" y="400" font-size="11" text-anchor="middle" fill="#52514e" font-weight="bold">HANGAR</text><path d="M140,600 L420,600 L470,585 L420,570 L300,570 L260,520 L235,520 L250,570 L160,570 L140,545 L122,545 L130,580 Z" fill="#dfe6ee" stroke="#0b0b0b" stroke-width="2"/><path d="M300,600 L330,640 L352,640 L340,600" fill="#dfe6ee" stroke="#0b0b0b" stroke-width="1.5"/><circle cx="300" cy="612" r="4" fill="#0b0b0b"/><line x1="300" y1="604" x2="300" y2="732" stroke="#0b0b0b"/><circle cx="300" cy="734" r="6" fill="#0b0b0b"/><rect x="170" y="648" width="120" height="26" fill="#fff1ea" stroke="#b3261e"/><text x="230" y="666" font-size="11" text-anchor="middle" fill="#b3261e" font-weight="bold">NOT FIT TO FLY</text><circle cx="230" cy="674" r="3" fill="#eb6834"/><path d="M230,674 L250,772" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="256" y="776" font-size="12.5" text-anchor="start" fill="#eb6834" font-weight="bold">Grounded by a record, not a fault</text><text x="256" y="791" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">the part is fitted; the record says it isn&#x27;t (ch. 6)</text><g transform="translate(460,740) scale(0.62) translate(-460,-740)"><circle cx="460" cy="678" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><path d="M451,672 l-3,-6 l6,3 l2,-7 l4,6 l3,-7 l2,7 l5,-4 l-1,7" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/><circle cx="456" cy="677" r="1.4" fill="#1a1a1a"/><circle cx="464" cy="677" r="1.4" fill="#1a1a1a"/><path d="M456,684 q4,-3 8,0" stroke="#1a1a1a" fill="none" stroke-width="1.3" stroke-linecap="round"/><line x1="460" y1="689" x2="460" y2="716" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="460" y1="698" x2="444" y2="692" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="460" y1="698" x2="470" y2="714" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><path d="M452,740 L460,716 L468,740" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="474" y="662" width="16" height="20" fill="#ffffff" stroke="#0b0b0b"/><circle cx="476" cy="652" r="3" fill="#52514e"/><path d="M476,652 L540,470" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="546" y="474" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="bold">The maintainer</text><text x="546" y="489" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">sees the truth; holds metis</text><rect x="740" y="170" width="240" height="220" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><text x="850" y="196" font-size="11" text-anchor="middle" fill="#0b0b0b" font-weight="bold">THE LOGISTICS SYSTEM</text><rect x="790" y="220" width="140" height="70" fill="#ece9e1" stroke="#52514e"/><line x1="800" y1="236" x2="920" y2="236" stroke="#b7b4ad" stroke-width="3"/><line x1="800" y1="250" x2="902" y2="250" stroke="#b7b4ad" stroke-width="3"/><line x1="800" y1="264" x2="884" y2="264" stroke="#b7b4ad" stroke-width="3"/><line x1="800" y1="278" x2="866" y2="278" stroke="#b7b4ad" stroke-width="3"/><text x="860" y="310" font-size="11" text-anchor="middle" fill="#52514e" font-style="italic">parts records</text><circle cx="860" cy="290" r="3" fill="#eb6834"/><path d="M860,290 L1004,300" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="1010" y="304" font-size="12.5" text-anchor="start" fill="#eb6834" font-weight="bold">The model, going stale</text><text x="1010" y="319" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">records incorrect, corrupt,</text><text x="1010" y="334" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">missing (GAO)</text><path d="M760,300 C 620,330 520,420 440,560" fill="none" stroke="#0b0b0b" stroke-width="7"/><path d="M430,548 L436,576 L456,558 Z" fill="#0b0b0b"/><text x="860" y="412" font-size="12" text-anchor="middle" fill="#0b0b0b" font-weight="bold">ACTS: grounds, orders, schedules</text><rect x="600" y="600" width="90" height="100" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><text x="645" y="622" font-size="10" text-anchor="middle" fill="#0b0b0b" font-weight="bold">ACTION</text><text x="645" y="634" font-size="10" text-anchor="middle" fill="#0b0b0b" font-weight="bold">REQUESTS</text><rect x="615" y="570" width="60" height="22" fill="#ffffff" stroke="#0b0b0b"/><text x="645" y="586" font-size="11" text-anchor="middle" fill="#eb6834" font-weight="bold">fee</text><path d="M500,660 H598" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="690" cy="600" r="3" fill="#eb6834"/><path d="M690,600 L700,704" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="706" y="708" font-size="12.5" text-anchor="start" fill="#eb6834" font-weight="bold">A fee per report (ch. 6)</text><text x="706" y="723" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">paid by the programme</text><g transform="translate(700,660)"><rect width="20" height="14" fill="#ffffff" stroke="#52514e"/><path d="M0,0 L10,7 L20,0" fill="none" stroke="#52514e"/></g><g transform="translate(730,634)"><rect width="20" height="14" fill="#ffffff" stroke="#52514e"/><path d="M0,0 L10,7 L20,0" fill="none" stroke="#52514e"/></g><g transform="translate(760,608)"><rect width="20" height="14" fill="#ffffff" stroke="#52514e"/><path d="M0,0 L10,7 L20,0" fill="none" stroke="#52514e"/></g><g transform="translate(790,582)"><rect width="20" height="14" fill="#ffffff" stroke="#52514e"/><path d="M0,0 L10,7 L20,0" fill="none" stroke="#52514e"/></g><g transform="translate(820,556)"><rect width="20" height="14" fill="#ffffff" stroke="#52514e"/><path d="M0,0 L10,7 L20,0" fill="none" stroke="#52514e"/></g><g transform="translate(850,530)"><rect width="20" height="14" fill="#ffffff" stroke="#52514e"/><path d="M0,0 L10,7 L20,0" fill="none" stroke="#52514e"/></g><g transform="translate(880,504)"><rect width="20" height="14" fill="#ffffff" stroke="#52514e"/><path d="M0,0 L10,7 L20,0" fill="none" stroke="#52514e"/></g><g transform="translate(910,478)"><rect width="20" height="14" fill="#ffffff" stroke="#52514e"/><path d="M0,0 L10,7 L20,0" fill="none" stroke="#52514e"/></g><g transform="translate(940,452)"><rect width="20" height="14" fill="#ffffff" stroke="#52514e"/><path d="M0,0 L10,7 L20,0" fill="none" stroke="#52514e"/></g><circle cx="850" cy="530" r="3" fill="#52514e"/><path d="M850,530 L1000,540" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="1006" y="544" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="bold">The queue</text><text x="1006" y="559" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">months per request; at one site,</text><text x="1006" y="574" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">aircraft grounded while it waited</text><rect x="980" y="620" width="160" height="96" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><line x1="980" y1="636" x2="1140" y2="636" stroke="#c9c8c3"/><line x1="980" y1="652" x2="1140" y2="652" stroke="#c9c8c3"/><line x1="980" y1="668" x2="1140" y2="668" stroke="#c9c8c3"/><line x1="980" y1="684" x2="1140" y2="684" stroke="#c9c8c3"/><line x1="980" y1="700" x2="1140" y2="700" stroke="#c9c8c3"/><line x1="1020" y1="620" x2="1020" y2="716" stroke="#c9c8c3"/><line x1="1060" y1="620" x2="1060" y2="716" stroke="#c9c8c3"/><line x1="1100" y1="620" x2="1100" y2="716" stroke="#c9c8c3"/><text x="1060" y="612" font-size="10" text-anchor="middle" fill="#0b0b0b" font-weight="bold">REAL RECORDS (DO NOT DELETE)</text><path d="M510,700 C 700,760 880,740 976,690" stroke="#eb6834" stroke-dasharray="6 4" fill="none" marker-end="url(#aa)"/><circle cx="1060" cy="716" r="3" fill="#eb6834"/><path d="M1060,716 L1150,772" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="1144" y="776" font-size="12.5" text-anchor="end" fill="#eb6834" font-weight="bold">The spreadsheet everyone actually trusts</text><text x="1144" y="791" font-size="11" text-anchor="end" fill="#52514e" font-style="italic">where feedback goes when the official loop is blocked</text><circle cx="990" cy="176" r="22" fill="#6aa86a" stroke="#0b0b0b"/><text x="990" y="172" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">100%</text><text x="990" y="184" font-size="7" text-anchor="middle" fill="#ffffff">compliant</text><circle cx="975" cy="164" r="3" fill="#52514e"/><path d="M975,164 L900,62" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="894" y="66" font-size="12.5" text-anchor="end" fill="#0b0b0b" font-weight="bold">Compliant (ch. 5)</text><text x="894" y="81" font-size="11" text-anchor="end" fill="#52514e" font-style="italic">the governed write their own evidence</text><path d="M100,440 v24 q0,8 8,8 q8,0 8,-8" fill="none" stroke="#52514e" stroke-width="2"/><text x="108" y="490" font-size="10" text-anchor="middle" fill="#52514e" font-style="italic">(no cord)</text><circle cx="108" cy="452" r="3" fill="#52514e"/><path d="M108,452 L140,300" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><text x="146" y="304" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="bold">Where a cord would hang</text><text x="146" y="319" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">nobody here may stop the system (ch. 12)</text></svg>