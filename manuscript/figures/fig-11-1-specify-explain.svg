<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Georgia, serif" role="img" aria-labelledby="t d">
<title id="t">Figure 11.1 — Specify, explain, or both</title>
<desc id="d">A triangle. Bottom left: Specify, StrongDM 2026, a locked vault of test scenarios, checkable but blind to what nobody wrote down. Bottom right: Explain, Goedecke 2026, a speech bubble reading why, finds better answers but hard to verify. Top: Intent specification, Leveson around 2000, a layered document where each layer carries a padlock and a speech bubble: constraints you can check, plus the reasons behind them, at every level. Arrows from both bottom corners point to the top.</desc>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 H0 V20" fill="none" stroke="#efeee9" stroke-width="1"/></pattern>
  <g id="lock"><rect x="-6" y="-2" width="12" height="10" fill="#0b0b0b"/><path d="M-4,-2 V-6 A4,4 0 0 1 4,-6 V-2" fill="none" stroke="#0b0b0b" stroke-width="2"/></g>
  <g id="bubble"><path d="M-10,-8 H10 A3,3 0 0 1 13,-5 V3 A3,3 0 0 1 10,6 H-2 L-8,11 V6 H-10 A3,3 0 0 1 -13,3 V-5 A3,3 0 0 1 -10,-8 Z" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/></g>
</defs>
<rect width="860" height="480" fill="#fcfcfb"/><rect width="860" height="480" fill="url(#grid)"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#0b0b0b">Specify, explain — or both</text>
<text x="24" y="58" font-size="13" fill="#52514e">Two ways to tell a governing layer what you want, and the older idea that joins them.</text>

<path d="M430,120 L150,360 L710,360 Z" fill="none" stroke="#c9c8c3" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="200" y1="318" x2="385" y2="160" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="660" y1="318" x2="475" y2="160" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#ah)"/>

<!-- top: layered doc -->
<g transform="translate(430,110)">
  <rect x="-44" y="-46" width="88" height="22" fill="#ffffff" stroke="#0b0b0b"/>
  <rect x="-44" y="-22" width="88" height="22" fill="#ffffff" stroke="#0b0b0b"/>
  <rect x="-44" y="2" width="88" height="22" fill="#ffffff" stroke="#0b0b0b"/>
  <use href="#lock" x="-28" y="-36"/><use href="#lock" x="-28" y="-12"/><use href="#lock" x="-28" y="12"/>
  <use href="#bubble" x="22" y="-36" transform="scale(1)"/><use href="#bubble" x="22" y="-12"/><use href="#bubble" x="22" y="12"/>
</g>
<text x="500" y="84" font-size="15" font-weight="bold" fill="#0b0b0b">Intent specification</text>
<text x="500" y="102" font-size="12" fill="#52514e">Leveson, ~2000</text>
<text x="500" y="122" font-size="12" fill="#0b0b0b" font-style="italic">constraints you can check, plus the</text>
<text x="500" y="138" font-size="12" fill="#0b0b0b" font-style="italic">reasons behind them, at every level</text>

<!-- bottom left: vault -->
<g transform="translate(150,380)">
  <rect x="-40" y="-26" width="80" height="56" rx="4" fill="#e4e3df" stroke="#0b0b0b" stroke-width="1.5"/>
  <circle r="13" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/><line x1="0" y1="-13" x2="0" y2="13" stroke="#0b0b0b"/><line x1="-13" y1="0" x2="13" y2="0" stroke="#0b0b0b"/>
  <use href="#lock" x="28" y="-14"/>
</g>
<text x="150" y="438" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b0b0b">Specify</text>
<text x="150" y="455" font-size="12" text-anchor="middle" fill="#52514e">StrongDM, 2026 — locked test scenarios</text>
<text x="150" y="472" font-size="12" text-anchor="middle" fill="#0b0b0b" font-style="italic">checkable, but blind to what nobody wrote down</text>

<!-- bottom right: why bubble -->
<g transform="translate(710,380) scale(2.6)"><use href="#bubble"/></g>
<text x="710" y="383" font-size="16" text-anchor="middle" fill="#eb6834" font-weight="bold" font-style="italic">why?</text>
<text x="710" y="438" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b0b0b">Explain</text>
<text x="710" y="455" font-size="12" text-anchor="middle" fill="#52514e">Goedecke, 2026 — give it the reasons</text>
<text x="710" y="472" font-size="12" text-anchor="middle" fill="#0b0b0b" font-style="italic">finds better answers, but hard to verify</text>
</svg>
